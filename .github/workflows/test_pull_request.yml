# Pull-request / main CI gate. On `pull_request` / `push` it compiles the server
# against the pinned NuGet packages and validates the Dockerfile builds. This is
# the required status check for branch protection — PRs (and auto-merge) are
# blocked until it is green.
#
# Chain leg (node `gamedev-mcp-server`): the SAME job also runs under
# `workflow_dispatch` with two inputs, the chain lock JSON (`lock`) and its 8-hex
# hash (`lock_hash8`). `.github/scripts/chain_feed.py` (vendored, byte-identical to
# ai-game-dev-software `.scripts/chain/leg/chain_feed.py`) then self-builds the
# ReflectorNet + McpPlugin / McpPlugin.Common / McpPlugin.Server producers the lock
# carries into a local feed and forces them with exact-version NuGet overrides
# (`[<version>-ws.g<sha8>]`) before restore — so the 8.2.0 / 5.4.0 csproj pins of
# every producer the lock carries are REPLACED by the lock's versions. That pin
# drift is named in the leg record's warnings[] (`record --warn`).
# Under a lock the `docker build` step is skipped (the Dockerfile restores from
# nuget.org at the csproj pins, so an image would be green against RELEASED bits)
# and the linux-x64 single-file server is published and fingerprinted instead. The
# binary is NOT uploaded (only small, essential files are uploaded, and nothing
# downloads it: every consumer leg builds the server itself from the lock's sha) — its
# version and exe sha256 are carried in the leg record's warnings[]. The only chain
# upload is the ~1 KB JSON leg record, kept for one day.
# Every lock value is validated by the script at load (a malformed lock exits 2 naming the
# field) and chain steps invoke the interpreter only through ${{ env.CHAIN_PY }}, an
# absolute path the resolver step proved runs.
# On an ordinary run `chain python (posix)` only resolves the interpreter, `chain feed`
# and `chain leg record` log "chain: no lock (ordinary run)" and exit 0, and the other
# chain steps are skipped.

name: test-pull-request

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      lock:
        description: the chain lock JSON (<= 60000 characters)
        required: true
        type: string
      lock_hash8:
        description: first 8 hex characters of the lock hash
        required: true
        type: string
  # release.yml calls this workflow as its full test set (before any publish).
  # A release is an ordinary run: it passes no lock, so CHAIN_LOCK is empty and
  # every chain step no-ops exactly as on push / pull_request.
  workflow_call:
    inputs:
      lock:
        description: the chain lock JSON (empty for an ordinary run)
        required: false
        type: string
        default: ""
      lock_hash8:
        description: first 8 hex characters of the lock hash (empty for an ordinary run)
        required: false
        type: string
        default: ""

# Empty on ordinary runs => GitHub's default title. The chain dispatcher
# (ai-game-dev-software `.scripts/chain/`) captures a dispatched run by this exact
# title + headSha. No `concurrency` block: nothing cancels today, and two different
# locks must be able to run side by side.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('chain {0} gamedev-mcp-server', inputs.lock_hash8) || '' }}

env:
  CHAIN_LOCK: ${{ inputs.lock }}
  CHAIN_LOCK_HASH8: ${{ inputs.lock_hash8 }}

# Least privilege: the job only reads the repository. The chain leg clones its PUBLIC
# producers anonymously and calls no GitHub API, and actions/upload-artifact authenticates
# with the runner's own Actions runtime token, not GITHUB_TOKEN — so nothing needs write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      # The interpreter is resolved ONCE and invoked through the ${{ env.CHAIN_PY }}
      # expression (the chain_feed.py print-fragment contract). The resolver RUNS each
      # candidate and exports its absolute, space-free sys.executable — never a bare
      # interpreter name. This job is ubuntu-only, so only the posix resolver is needed.
      - name: chain python (posix)
        if: runner.os != 'Windows' && env.CHAIN_PY == ''
        shell: bash
        run: |
          for c in python3 python; do
            exe="$("$c" -c 'import sys, select, zlib, hashlib; sys.version_info >= (3, 9) or sys.exit(1); print(sys.executable.replace(chr(92), chr(47)))' 2>/dev/null)" || continue
            case "$exe" in /*) ;; *) continue ;; esac
            case "$exe" in *[[:space:]]*) continue ;; esac
            [ -f "$exe" ] && [ -x "$exe" ] || continue
            echo "CHAIN_PY=$exe" >> "$GITHUB_ENV"; exit 0
          done
          echo 'chain: no Python 3.9+ on PATH that runs and reports an absolute, space-free sys.executable (tried python3, python)' >&2; exit 2

      # This job consumes EVERY edge of the node (reflectornet/nupkg,
      # mcp-plugin-dotnet/server, mcp-plugin-dotnet/mcpplugin), so `apply` and `record`
      # both omit --edges — the SAME (default) scope on both.
      - name: chain feed
        id: chain
        run: ${{ env.CHAIN_PY }} .github/scripts/chain_feed.py apply --node gamedev-mcp-server --job build

      # Chain only: name the pin drift the override introduces — each forced package's csproj
      # pin vs the lock's ws version — and export it as CHAIN_PIN_DRIFT for `record --warn`.
      # It runs before restore, so a leg that later goes red still records the drift.
      - name: chain pin drift
        if: env.CHAIN_ACTIVE == '1'
        shell: bash
        run: |
          ${{ env.CHAIN_PY }} - <<'EOF'
          import re, sys, types
          sys.path.insert(0, ".github/scripts")
          import chain_feed as cf
          try:
              ctx = cf.build_context(types.SimpleNamespace(node="gamedev-mcp-server", job="build", lock=None, lock_file=None, checkout=None, runner_temp=None))
              rows = cf.nuget_rows_for_node(ctx, ctx.node)
              csproj = open("com.IvanMurzak.GameDev.MCP.Server.csproj", encoding="utf-8-sig").read()
              pins = dict(re.findall(r'<PackageReference\s+Include="([^"]+)"\s+Version="([^"]+)"', csproj))
              drift = []
              for r in rows:
                  pin = pins.get(r["package_id"])
                  if pin != r["ws_version"]:
                      drift.append("%s %s -> %s" % (r["package_id"], pin or "unpinned (transitive)", r["ws_version"]))
              if drift:
                  line = "pin drift (csproj pins forced to the lock's ws versions by the chain override): " + "; ".join(drift)
                  print("chain: " + line)
                  cf._write_github_env([("CHAIN_PIN_DRIFT", line)])
          except cf.Refusal as exc:
              print("chain: refused: %s" % exc, file=sys.stderr)
              sys.exit(2)
          EOF

      - name: Restore
        run: dotnet restore com.IvanMurzak.GameDev.MCP.Server.csproj

      - name: Build (Release)
        run: dotnet build com.IvanMurzak.GameDev.MCP.Server.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/GameDev.MCP.Server.Tests/GameDev.MCP.Server.Tests.csproj -c Release

      # The leg record (below) proves only the HOST csproj's obj/project.assets.json, and
      # not McpPlugin.Common. The test project restores separately during `dotnet test`:
      # assert that BOTH assets files resolve every package the override forced (the
      # script's own rows, Common included) at exactly the lock's ws version. Exit 3 on
      # any mismatch, or when the override forced nothing.
      - name: chain identity (test project)
        if: env.CHAIN_ACTIVE == '1'
        shell: bash
        run: |
          ${{ env.CHAIN_PY }} - <<'EOF'
          import json, sys, types
          sys.path.insert(0, ".github/scripts")
          import chain_feed as cf
          try:
              ctx = cf.build_context(types.SimpleNamespace(node="gamedev-mcp-server", job="build", lock=None, lock_file=None, checkout=None, runner_temp=None))
              rows = cf.nuget_rows_for_node(ctx, ctx.node)
          except cf.Refusal as exc:
              print("chain: refused: %s" % exc, file=sys.stderr)
              sys.exit(2)
          def libs(path):
              return cf._library_versions(json.load(open(path, encoding="utf-8-sig")))
          host = libs("obj/project.assets.json")
          tests = libs("tests/GameDev.MCP.Server.Tests/obj/project.assets.json")
          bad = 0 if rows else 1
          if not rows:
              print("chain: FAIL the override forced no NuGet package, nothing to prove")
          for row in rows:
              pkg, want = row["package_id"], row["ws_version"]
              ok = host.get(pkg) == want and tests.get(pkg) == want
              bad += not ok
              print("chain: %s %s expected=%s host=%s tests=%s" % ("OK  " if ok else "FAIL", pkg, want, host.get(pkg), tests.get(pkg)))
          sys.exit(3 if bad else 0)
          EOF

      - name: Validate Dockerfile (build image, no push)
        if: env.CHAIN_ACTIVE != '1'
        run: docker build -t gamedev-mcp-server:ci .

      # Chain only: publish the linux-x64 single-file server by chain_feed.py's embedded
      # RECIPES publish line (the build/build-all.sh flags, unsigned, at -p:Version=<ws>) into
      # .artifacts/server/<ws>/linux-x64, write the chain-identity.json marker with the
      # vendored script's own writer (never by executing the exe — it has no --version), and
      # export CHAIN_SERVER_IDENTITY (ws version, sha, exe sha256, size) for `record --warn`.
      # The binary itself is NOT uploaded: nothing downloads it, because every consumer leg
      # builds the server itself from the lock's sha.
      - name: chain server binary (linux-x64)
        if: env.CHAIN_ACTIVE == '1'
        shell: bash
        run: |
          ${{ env.CHAIN_PY }} - <<'EOF'
          import json, sys, types
          sys.path.insert(0, ".github/scripts")
          import chain_feed as cf
          node = "gamedev-mcp-server"
          try:
              ctx = cf.build_context(types.SimpleNamespace(node=node, job="build", lock=None, lock_file=None, checkout=None, runner_temp=None))
              rid = cf.host_rid()
              publish = next(c for c in cf.RECIPES[node]["pack"] if c.startswith("dotnet publish "))
              # the command runs with shell=True: quote every pasted value exactly as the script's own
              # build_plan / dry-run do, so the published command is the plan's text
              cmd = cf.substitute(publish, cf.placeholder_values(ctx, node, ctx.checkout), quote=cf.shell_value)
              if cf.run(cmd, cwd=ctx.checkout, env=ctx.command_env(), shell=True) != 0:
                  raise cf.Refusal("`%s` failed" % cmd)
              exe = cf.server_exe_path(ctx, cf.RECIPES[node]["artifacts"]["binary"]["id"], ctx.ws_version(node), rid)
              if not exe.is_file():
                  raise cf.Refusal("publish exited 0 but %s is missing" % cf.as_posix_abs(exe))
              marker = cf.write_server_marker(exe.parent, ws_version=ctx.ws_version(node), sha=ctx.sha(node) or "", rid=rid, publish_cmd=cmd, exe=exe)
              text = marker.read_text(encoding="utf-8")
              print(text, end="")
              data = json.loads(text)
              line = "server binary not uploaded (owner artifact rule): %s %s ws_version=%s sha=%s exe_sha256=%s size=%d" % (
                  exe.name, rid, data.get("ws_version"), data.get("sha"), data.get("exe_sha256"), exe.stat().st_size)
              print("chain: " + line)
              cf._write_github_env([("CHAIN_SERVER_IDENTITY", line)])
          except cf.Refusal as exc:
              print("chain: refused: %s" % exc, file=sys.stderr)
              sys.exit(2)
          EOF

      # Identity proof, read from the host csproj's obj/project.assets.json (not inferred from
      # a restore exit code): it must resolve the ws ReflectorNet + McpPlugin packages the lock
      # carries. Exits 3 when any proof fails or none exists (=> this job is RED even if the
      # tests passed), 2 on a refusal, 0 with no lock. The record also lists the named skip
      # `docker build` ("image: n/a (not overridden)"). A blank --warn is dropped by the script,
      # so an unset CHAIN_PIN_DRIFT / CHAIN_SERVER_IDENTITY (no lock, no drift, or its step was
      # skipped or failed) adds nothing.
      - name: chain leg record
        id: chain_record
        if: always()
        shell: bash
        run: ${{ env.CHAIN_PY }} .github/scripts/chain_feed.py record --node gamedev-mcp-server --job build --job-status ${{ job.status }} --warn "$CHAIN_PIN_DRIFT" --warn "$CHAIN_SERVER_IDENTITY" --out chain-leg.json

      - name: chain leg artifact
        if: always() && steps.chain_record.outputs.artifact_name != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.chain_record.outputs.artifact_name }}
          path: chain-leg.json
          retention-days: 1
