# This workflow builds the MCP server executables for all platforms, code-signs
# them, zips them, and hands the 7 zips to release.yml as workflow ARTIFACTS.
# Reusable CHILD of release.yml ONLY (workflow_call): it has no release /
# dispatch trigger of its own and it never touches a GitHub Release. release.yml
# creates the tag + GitHub Release AFTER NuGet and Docker Hub are published and
# attaches these zips plus a SHA256SUMS manifest it computes from them.
#
# Code-signing is GRACEFULLY DEGRADING: every signing/notarization step is
# guarded on its secret being non-empty. A run with NO signing secrets set
# still builds and zips ALL 7 unsigned zips so releases stay green before the
# secrets are provisioned.
#
# Platform split:
#   - self-hosted Mac job -> osx-x64, osx-arm64 (codesign + notarytool),
#                            plus linux-x64, linux-arm64 (unsigned, cross-built).
#   - windows-latest job -> win-x64, win-x86, win-arm64 (Azure Trusted Signing).
# signtool cannot run on macOS, so the Windows RIDs need their own runner.
#
# dry_run: every build / sign / zip step still runs (so a dry run proves the
# signing secrets and the build recipe), but the zips are NOT uploaded as
# artifacts — nothing consumes them on a dry run.
#
# (The former manual `workflow_dispatch` SHA256SUMS backfill onto an existing
# release is gone with the dispatch trigger; release.yml now always attaches
# SHA256SUMS in the same step that creates the release.)

name: deploy-server-executables

on:
  workflow_call:
    inputs:
      version:
        description: "Release version (e.g., 8.0.1), no 'v' prefix. Informational."
        required: true
        type: string
      dry_run:
        description: "Build, sign and zip, but do not upload the zips as artifacts."
        required: false
        type: boolean
        default: false

# Artifact upload uses the Actions runtime token, not GITHUB_TOKEN, so this
# child only needs to read the repository.
permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────────
  # macOS + Linux: osx-x64, osx-arm64 (signed + notarized), linux-x64,
  # linux-arm64 (unsigned). Cross-builds the linux RIDs fine.
  #
  # RUNNER: the owner's own Mac (`[self-hosted, macOS, ARM64]`, placed by
  # runner-manager's coordinator; AI-Game-Dev-App's macOS jobs use the same
  # labels, its signing jobs add `not-weak`). GitHub-hosted macOS arm64 runners repeatedly could not be
  # acquired ("capacity constraints"). The Mac is PERSISTENT and is the
  # owner's daily machine, so every step here must leave it as it found it:
  #   - the .NET SDK, NuGet packages and dotnet CLI home live in RUNNER_TEMP,
  #     never in the user's home or system;
  #   - the signing keychain is temporary, its password random per run, and
  #     the "Clean up signing keychain" step (`always()`) deletes it and takes
  #     its entry back off the user keychain search list;
  #   - decoded secrets (.p12, .p8) live in RUNNER_TEMP with umask 077 and are
  #     removed again, on failure too.
  # ────────────────────────────────────────────────────────────────────
  build-macos-linux:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    # Job-level env so the signing/notarization guards (`if: env.X != ''`) can
    # read these. A step's own `env:` block is NOT visible to that same step's
    # `if:` — the condition is evaluated before the step env is applied — so the
    # graceful-degradation guards MUST resolve their values at job scope.
    env:
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
      APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The SDK, the NuGet package cache (runtime packs for 4 RIDs, hundreds of
      # MB) and the CLI's first-run files default to the user's home; keep them
      # in RUNNER_TEMP. A job-level `env:` cannot read `runner.temp`, hence
      # GITHUB_ENV.
      - name: Keep .NET state in the runner temp directory
        run: |
          {
            echo "NUGET_PACKAGES=$RUNNER_TEMP/nuget-packages"
            echo "DOTNET_CLI_HOME=$RUNNER_TEMP/dotnet-home"
            echo "DOTNET_CLI_TELEMETRY_OPTOUT=1"
            echo "DOTNET_NOLOGO=1"
          } >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: "10.0.x"

      # `python3` is the Xcode Command Line Tools interpreter (3.9), which this
      # job needs anyway for codesign / xcrun notarytool. build_all.py is
      # stdlib-only and supports 3.9+.
      - name: Build executables (osx + linux, no zip yet)
        run: python3 build/build_all.py Release --no-zip osx-x64 osx-arm64 linux-x64 linux-arm64

      # Import the Developer ID Application certificate into a temporary
      # keychain. Guarded on ALL THREE mac signing secrets so a partial-secrets
      # dispatch (e.g. MAC_CSC_LINK set but MAC_SIGN_IDENTITY empty) skips the
      # whole sign+notarize path cleanly rather than dying under `set -e` and
      # taking the unsigned-upload fallback down with it. Result: missing or
      # partial mac secrets => unsigned-but-green release is still produced.
      #
      # Ported from AI-Game-Dev-App release.yml "Prepare signing keychain",
      # which is measured on this Mac:
      #   - import with `-A` and NO `set-key-partition-list`: macOS 26+ refuses
      #     that call from the runner's non-interactive context. `-A` lets any
      #     process of this user sign with the key while the keychain is
      #     unlocked and listed; the keychain holds only this certificate and
      #     is deleted by the cleanup step at the end of the job. Unlike the
      #     App's single-repository runner, this Mac's runners serve several
      #     repositories concurrently, so that window is open to their jobs
      #     too (an owner-accepted trade-off; see the PR that added this);
      #   - our keychain is PREPENDED to the user search list, never replacing
      #     it: `list-keychains -s` REPLACES the list, and dropping the login
      #     keychain is persistent damage. codesign also needs the login
      #     keychain listed to build the Developer ID chain (measured);
      #   - signing goes by the certificate's SHA-1 within OUR keychain: the
      #     owner's login keychain holds another certificate with the same
      #     display name, so signing by name is ambiguous there.
      - name: Import macOS signing certificate
        if: ${{ env.MAC_CSC_LINK != '' && env.MAC_CSC_KEY_PASSWORD != '' && env.MAC_SIGN_IDENTITY != '' }}
        run: |
          set -euo pipefail
          # The decoded .p12 and the keychain must not be world-readable on
          # the owner's machine (the default umask 022 would make them 0644).
          umask 077
          # Must match the literal in "Clean up signing keychain".
          KC="$RUNNER_TEMP/gdms-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/gdms-certificate.p12"
          # No pipe (`tr </dev/urandom | head`), so no SIGPIPE under pipefail.
          KCPASS="$(openssl rand -hex 32)"

          # A keychain left by a run that died before its cleanup (reboot,
          # runner restart): delete it so create-keychain does not fail.
          if [ -e "$KC" ]; then
            security delete-keychain "$KC" || rm -f "$KC"
          fi

          printf '%s' "$MAC_CSC_LINK" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KCPASS" "$KC"
          # Lock after 6h idle as a backstop; NOT `-l` (lock on sleep): the Mac
          # can sleep mid-build.
          security set-keychain-settings -u -t 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import "$CERT_PATH" -k "$KC" -P "$MAC_CSC_KEY_PASSWORD" -A -f pkcs12
          rm -f "$CERT_PATH"

          # Read the CURRENT list into an array (bash 3.2 on macOS: no mapfile;
          # the counter avoids expanding an empty array under `set -u`), drop
          # any stale entry for our own path, and prepend ours.
          CURRENT=()
          CURRENT_COUNT=0
          LIST="$(security list-keychains -d user)"
          while IFS= read -r kc; do
            kc="${kc#*\"}"; kc="${kc%\"*}"  # strip the indent and quotes
            [ -n "$kc" ] || continue
            [ "$kc" != "$KC" ] || continue
            CURRENT+=("$kc")
            CURRENT_COUNT=$((CURRENT_COUNT + 1))
          done <<< "$LIST"
          # An unreadable list (e.g. a runner running as root, which has no
          # user keychain list) must not become a one-entry list: `security`
          # would report that as success and the damage would persist.
          if [ "$CURRENT_COUNT" -eq 0 ]; then
            echo "::error::Could not read the user keychain search list — refusing to modify it"
            exit 1
          fi
          security list-keychains -d user -s "$KC" "${CURRENT[@]}"

          # Resolve MAC_SIGN_IDENTITY (a name or a SHA-1) to the SHA-1 of the
          # matching identity in OUR keychain, so codesign cannot pick the
          # same-named certificate from the login keychain. Capture once and
          # match the text: `security … | grep -q` is a SIGPIPE trap.
          IDENTITIES="$(security find-identity -v -p codesigning "$KC")"
          printf '%s\n' "$IDENTITIES"
          SIGN_HASH=""
          while IFS= read -r line; do
            case "$line" in
              *"$MAC_SIGN_IDENTITY"*)
                SIGN_HASH="$(printf '%s\n' "$line" | sed -n 's/^ *[0-9][0-9]*) \([0-9A-F]\{40\}\) .*/\1/p')"
                [ -z "$SIGN_HASH" ] || break
                ;;
            esac
          done <<< "$IDENTITIES"
          if [ -z "$SIGN_HASH" ]; then
            echo "::error::No codesigning identity matching MAC_SIGN_IDENTITY in the imported certificate"
            exit 1
          fi
          echo "signing identity hash: $SIGN_HASH"

          echo "KEYCHAIN_PATH=$KC" >> "$GITHUB_ENV"
          echo "SIGN_HASH=$SIGN_HASH" >> "$GITHUB_ENV"

      # Same all-three-secrets guard as the import step: never reach `codesign
      # --sign` without an imported identity (which would fail under `set -e`
      # and sink the whole job, including the unsigned upload).
      - name: Code-sign macOS executables (hardened runtime)
        if: ${{ env.MAC_CSC_LINK != '' && env.MAC_CSC_KEY_PASSWORD != '' && env.MAC_SIGN_IDENTITY != '' }}
        run: |
          set -euo pipefail
          # codesign builds the certificate chain only from keychains on the
          # search list. A concurrent job on this Mac that writes back an older
          # snapshot of the list can drop our entry, so put it back if needed.
          LIST="$(security list-keychains -d user)"
          case "$LIST" in
            *"\"$KEYCHAIN_PATH\""*) ;;
            *)
              echo "::warning::signing keychain fell off the user search list; prepending it again"
              CURRENT=()
              CURRENT_COUNT=0
              while IFS= read -r kc; do
                kc="${kc#*\"}"; kc="${kc%\"*}"  # strip the indent and quotes
                [ -n "$kc" ] || continue
                CURRENT+=("$kc")
                CURRENT_COUNT=$((CURRENT_COUNT + 1))
              done <<< "$LIST"
              if [ "$CURRENT_COUNT" -eq 0 ]; then
                echo "::error::Could not read the user keychain search list — refusing to modify it"
                exit 1
              fi
              security list-keychains -d user -s "$KEYCHAIN_PATH" "${CURRENT[@]}"
              ;;
          esac

          ENTITLEMENTS="build/entitlements.mac.plist"
          for rid in osx-x64 osx-arm64; do
            BIN="publish/${rid}/gamedev-mcp-server"
            echo "Signing ${BIN}..."
            codesign --force --options runtime --timestamp \
              --entitlements "$ENTITLEMENTS" \
              --keychain "$KEYCHAIN_PATH" \
              --sign "$SIGN_HASH" "$BIN"
            codesign --verify --strict --verbose=2 "$BIN"
          done

      # Zips under a `<rid>/` folder, keeping the exec bit (build/build_all.py docstring).
      - name: Zip executables
        run: python3 build/build_all.py --zip-only osx-x64 osx-arm64 linux-x64 linux-arm64

      # Notarize the two macOS zips with notarytool (App Store Connect API key).
      # Guarded on the SAME three signing secrets as the codesign step PLUS the
      # notarize API key — notarizing an UNSIGNED binary is meaningless, so the
      # signing guard is part of this condition (notarize secrets present but
      # signing secrets absent must NOT submit unsigned zips). Missing either
      # set => skip cleanly and still upload the (unsigned) zips.
      - name: Notarize macOS zips
        if: ${{ env.MAC_CSC_LINK != '' && env.MAC_CSC_KEY_PASSWORD != '' && env.MAC_SIGN_IDENTITY != '' && env.APPLE_API_KEY_B64 != '' }}
        run: |
          set -euo pipefail
          # Unencrypted private key on the owner's machine: owner-only, and
          # the cleanup step removes it if this step fails before its `rm`.
          umask 077
          KEY_PATH="$RUNNER_TEMP/gdms-AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$KEY_PATH"

          for rid in osx-x64 osx-arm64; do
            ZIP="publish/gamedev-mcp-server-${rid}.zip"
            echo "Notarizing ${ZIP}..."
            # `notarytool submit --wait` exits 0 even when the submission is
            # Invalid/Rejected (it only fails on transport errors), so the exit
            # code alone is NOT proof of acceptance. Capture the JSON result and
            # fail the step unless status == "Accepted".
            SUBMIT_JSON="$(xcrun notarytool submit "$ZIP" \
              --key "$KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --wait \
              --output-format json)"
            echo "$SUBMIT_JSON"
            STATUS="$(echo "$SUBMIT_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')"
            if [ "$STATUS" != "Accepted" ]; then
              echo "::error::Notarization for ${rid} did not succeed (status: ${STATUS:-unknown})"
              exit 1
            fi
            echo "Notarization for ${rid} accepted."
          done

          rm -f "$KEY_PATH"

      - name: Upload zips as artifact (osx + linux)
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: server-zips-macos-linux
          path: ./publish/*.zip
          if-no-files-found: error
          retention-days: 1

      # The keychain FILE lives in RUNNER_TEMP, but the user keychain SEARCH
      # LIST is persistent state on the owner's Mac: without this step every
      # run would leave an entry pointing at a deleted keychain. `always()` so
      # a failed or cancelled-mid-step build still leaves the runner clean.
      #
      # Removes ONLY this job's entry from the CURRENT list instead of
      # restoring a snapshot taken at import time: several runners share the
      # one user search list on that Mac, so writing back an old snapshot
      # would drop (or resurrect) another concurrent job's keychain.
      - name: Clean up signing keychain
        if: always()
        run: |
          set -euo pipefail
          # Must match the literal in "Import macOS signing certificate".
          KC="$RUNNER_TEMP/gdms-signing.keychain-db"

          # Unsigned build: the import step never created a keychain.
          if [ -e "$KC" ]; then
            # Array + counter: /bin/bash on macOS is 3.2 (no mapfile, and an
            # empty array expansion is an unbound-variable error under -u).
            KEEP=()
            KEEP_COUNT=0
            FOUND=false
            # A failed read yields an empty list, which the guard below
            # leaves untouched; the keychain itself is still deleted.
            LIST="$(security list-keychains -d user)" || LIST=""
            while IFS= read -r kc; do
              kc="${kc#*\"}"; kc="${kc%\"*}"  # strip the indent and quotes
              [ -n "$kc" ] || continue
              if [ "$kc" = "$KC" ]; then FOUND=true; continue; fi
              KEEP+=("$kc")
              KEEP_COUNT=$((KEEP_COUNT + 1))
            done <<< "$LIST"
            if [ "$FOUND" != true ]; then
              echo "This job's keychain is not on the user search list — list left unchanged."
            elif [ "$KEEP_COUNT" -eq 0 ]; then
              # Setting an EMPTY list would succeed silently and wipe the
              # owner's login keychain from it — never do that.
              echo "::warning::the user keychain search list holds only this job's keychain; leaving it unchanged"
            else
              security list-keychains -d user -s "${KEEP[@]}" \
                || echo "::warning::failed to remove $KC from the user keychain search list"
            fi
            security delete-keychain "$KC" || echo "::warning::failed to delete $KC"
          fi

          # Decoded secrets are removed by their own steps on success; this
          # covers a failure in between. `|| true`: a stray temp-file error
          # must not fail an otherwise good release.
          rm -f "$RUNNER_TEMP/gdms-certificate.p12" "$RUNNER_TEMP/gdms-AuthKey.p8" || true

          # Printing the result is what turns a green cleanup into evidence.
          echo "user keychain search list after cleanup:"
          security list-keychains -d user || true

  # ────────────────────────────────────────────────────────────────────
  # Windows: win-x64, win-x86, win-arm64. Signed with Azure Trusted Signing
  # (signtool is Windows-only). Built on windows-latest via build/build_all.py.
  # ────────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    # Job-level env so the Azure Trusted Signing guard (`if: env.AZURE_CLIENT_ID
    # != ''`) can read it — a step's own `env:` is not visible to that step's
    # own `if:`. See the macOS job's env comment for the full rationale.
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # `python`, not `python3`: the hosted Windows image ships python.exe only.
      - name: Build executables (win, no zip yet)
        run: python build/build_all.py Release --no-zip win-x64 win-x86 win-arm64

      # Sign every .exe under the publish dir via Azure Trusted Signing.
      # Guarded: the step is skipped when AZURE_CLIENT_ID is empty, leaving the
      # executables unsigned but still uploadable.
      - name: Sign Windows executables (Azure Trusted Signing)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net
          trusted-signing-account-name: ivan-murzak
          certificate-profile-name: ai-game-dev-cert
          files-folder: ${{ github.workspace }}/publish
          files-folder-filter: exe
          files-folder-recurse: true

      # Flat zips: the files at the zip root (build/build_all.py docstring).
      - name: Zip executables
        run: python build/build_all.py --zip-only win-x64 win-x86 win-arm64

      - name: Upload zips as artifact (win)
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: server-zips-windows
          path: ./publish/*.zip
          if-no-files-found: error
          retention-days: 1
