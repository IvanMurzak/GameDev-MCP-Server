# Builds and pushes the multi-arch Docker image to Docker Hub
# (aigamedeveloper/mcp-server). Mirrors the engine repos' deploy.yml
# docker job. Reusable CHILD of release.yml ONLY (workflow_call) — it has no
# release / dispatch trigger of its own, so the only path to a push is a
# manual dispatch of release.yml, after its full test set. On `dry_run` the
# multi-arch image is still BUILT, but Docker Hub login and push are skipped.

name: deploy-docker

on:
  workflow_call:
    inputs:
      version:
        description: "Docker Hub image version (e.g., 8.0.0), no 'v' prefix."
        required: true
        type: string
      dry_run:
        description: "Build the image but do not log in or push."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy-docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract version from input or release tag
        id: version
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          raw="$RAW_VERSION"
          # Tolerate a v-prefixed value (v8.0.1); the image tag is not prefixed (8.0.1).
          version="${raw#v}"
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Extracted version: $version (from $raw)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ !inputs.dry_run }}
          tags: |
            aigamedeveloper/mcp-server:${{ steps.version.outputs.version }}
            aigamedeveloper/mcp-server:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          # A dry run reads the layer cache but never writes it.
          cache-to: ${{ !inputs.dry_run && 'type=gha,mode=max' || '' }}
