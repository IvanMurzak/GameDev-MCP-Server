<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="An AI agent talks MCP over stdio or HTTP to gamedev-mcp-server, which forwards each call over SignalR to the Unity-MCP, Godot-MCP or Unreal-MCP plugin">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#080F17"/><stop offset="1" stop-color="#030609"/></linearGradient>
    <radialGradient id="hzR" cx="0.18" cy="0" r="0.6"><stop offset="0" stop-color="#FF002A" stop-opacity="0.16"/><stop offset="1" stop-color="#FF002A" stop-opacity="0"/></radialGradient>
    <radialGradient id="hzB" cx="0.85" cy="0" r="0.6"><stop offset="0" stop-color="#3B9BFF" stop-opacity="0.14"/><stop offset="1" stop-color="#3B9BFF" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#A8C2D2" fill-opacity="0.08"/></pattern>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF002A" stop-opacity="0"/><stop offset="0.3" stop-color="#FF2448" stop-opacity="0.6"/><stop offset="0.7" stop-color="#3B9BFF" stop-opacity="0.55"/><stop offset="1" stop-color="#3B9BFF" stop-opacity="0"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0C1620"/><stop offset="1" stop-color="#070D14"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF5A73"/><stop offset="1" stop-color="#6FA8D0"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="470" rx="18"/></clipPath>
  </defs>
  <style>
    .s { font-family: Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; } .m { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace; white-space: pre; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: .85; transform: scale(1); } 50% { opacity: 1; transform: scale(1.04); } }
    .spin { animation: spin 40s linear infinite; transform-box: fill-box; transform-origin: center; }
    .spin.r { animation-duration: 60s; animation-direction: reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .blink { animation: blink 1.1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="470" fill="url(#bg)"/><rect width="1200" height="470" fill="url(#hzR)"/><rect width="1200" height="470" fill="url(#hzB)"/>
    <rect width="1200" height="470" fill="url(#dots)"/>
    <text x="190" y="64" text-anchor="middle" class="s" font-size="16" font-weight="700" letter-spacing="2.4" fill="#FF5A73">MCP CLIENT</text><text x="600" y="64" text-anchor="middle" class="s" font-size="16" font-weight="700" letter-spacing="2.4" fill="#FF5A73">THIS REPOSITORY</text><text x="1015" y="64" text-anchor="middle" class="s" font-size="16" font-weight="700" letter-spacing="2.4" fill="#FF5A73">ENGINE PLUGIN</text><path id="w5" d="M340 230 L450 230" fill="none" stroke="#FF5A73" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#FF5A73"><animateMotion dur="1.8s" begin="-0.0s" repeatCount="indefinite"><mpath href="#w5"/></animateMotion></circle><path id="w6" d="M750 230 C810 230 810 135 870 135" fill="none" stroke="#22C55E" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#22C55E"><animateMotion dur="2.2s" begin="-0.0s" repeatCount="indefinite"><mpath href="#w6"/></animateMotion></circle><path id="w7" d="M750 230 L870 230" fill="none" stroke="#6FA8D0" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#6FA8D0"><animateMotion dur="1.9s" begin="-0.5s" repeatCount="indefinite"><mpath href="#w7"/></animateMotion></circle><path id="w8" d="M750 230 C810 230 810 325 870 325" fill="none" stroke="#EAB308" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#EAB308"><animateMotion dur="2.4s" begin="-1.0s" repeatCount="indefinite"><mpath href="#w8"/></animateMotion></circle><text x="395" y="218" text-anchor="middle" class="m" font-size="16" fill="#A8C2D2">MCP</text><rect x="770" y="240" width="80" height="26" rx="13" fill="#0D1A25" stroke="rgba(111,168,208,0.45)"/><text x="810" y="258" text-anchor="middle" class="m" font-size="16" fill="#A8C2D2">SignalR</text><rect x="40" y="130" width="300" height="200" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="40" y="142" width="3" height="176" rx="1.5" fill="#6FA8D0"/><text x="62" y="226.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">AI agent</text><text x="62" y="252.0" class="s" font-size="16" fill="#8AA6B8">Claude Code · Codex · Cursor</text><text x="62" y="274.0" class="s" font-size="16" fill="#8AA6B8">Copilot · Gemini · …</text><rect x="450" y="120" width="300" height="220" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="450" y="132" width="3" height="196" rx="1.5" fill="#FF5A73"/><text x="472" y="226.0" class="m" font-size="19" font-weight="700" fill="#FAFFFD">gamedev-mcp-server</text><text x="472" y="252.0" class="s" font-size="16" fill="#8AA6B8">MCP over stdio or HTTP</text><text x="472" y="274.0" class="s" font-size="16" fill="#8AA6B8">auth: none · token · oauth</text><rect x="870" y="95" width="290" height="80" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="870" y="107" width="3" height="56" rx="1.5" fill="#22C55E"/><text x="892" y="131.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">Unity-MCP</text><text x="892" y="157.0" class="s" font-size="16" fill="#8AA6B8">Unity Editor and games</text><rect x="870" y="190" width="290" height="80" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="870" y="202" width="3" height="56" rx="1.5" fill="#6FA8D0"/><text x="892" y="226.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">Godot-MCP</text><text x="892" y="252.0" class="s" font-size="16" fill="#8AA6B8">Godot Editor and games</text><rect x="870" y="285" width="290" height="80" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="870" y="297" width="3" height="56" rx="1.5" fill="#EAB308"/><text x="892" y="321.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">Unreal-MCP</text><text x="892" y="347.0" class="s" font-size="16" fill="#8AA6B8">Unreal Editor and games</text><text x="600" y="420" text-anchor="middle" class="s" font-size="18" fill="#A8C2D2">Tools, prompts and resources come from the plugin that connects.</text>
    <rect x="0" y="468" width="1200" height="2" fill="url(#rule)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="469" rx="18" fill="none" stroke="rgba(111,168,208,0.16)"/>
</svg>
