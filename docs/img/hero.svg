<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="GameDev MCP Server: one MCP server between AI agents and the Unity, Godot and Unreal editor plugins">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#080F17"/><stop offset="1" stop-color="#030609"/></linearGradient>
    <radialGradient id="hzR" cx="0.18" cy="0" r="0.6"><stop offset="0" stop-color="#FF002A" stop-opacity="0.16"/><stop offset="1" stop-color="#FF002A" stop-opacity="0"/></radialGradient>
    <radialGradient id="hzB" cx="0.85" cy="0" r="0.6"><stop offset="0" stop-color="#3B9BFF" stop-opacity="0.14"/><stop offset="1" stop-color="#3B9BFF" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#A8C2D2" fill-opacity="0.08"/></pattern>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF002A" stop-opacity="0"/><stop offset="0.3" stop-color="#FF2448" stop-opacity="0.6"/><stop offset="0.7" stop-color="#3B9BFF" stop-opacity="0.55"/><stop offset="1" stop-color="#3B9BFF" stop-opacity="0"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0C1620"/><stop offset="1" stop-color="#070D14"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF5A73"/><stop offset="1" stop-color="#6FA8D0"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="380" rx="18"/></clipPath>
  </defs>
  <style>
    .s { font-family: Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; } .m { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace; white-space: pre; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: .85; transform: scale(1); } 50% { opacity: 1; transform: scale(1.04); } }
    .spin { animation: spin 40s linear infinite; transform-box: fill-box; transform-origin: center; }
    .spin.r { animation-duration: 60s; animation-direction: reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .blink { animation: blink 1.1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#bg)"/><rect width="1200" height="380" fill="url(#hzR)"/><rect width="1200" height="380" fill="url(#hzB)"/>
    <rect width="1200" height="380" fill="url(#dots)"/>
    <text x="64" y="104" text-anchor="start" class="s" font-size="16" font-weight="700" letter-spacing="2.4" fill="#FF5A73">AI GAME DEVELOPER</text><text x="64" y="176" class="s" font-size="56" font-weight="800" letter-spacing="-2" fill="#FAFFFD">GameDev <tspan fill="#FF5A73">MCP Server</tspan></text><text x="64" y="226" class="s" font-size="22" fill="#A8C2D2">One MCP server for the Unity, Godot</text><text x="64" y="258" class="s" font-size="22" fill="#A8C2D2">and Unreal editor plugins.</text><g transform="translate(64 304)"><rect width="91" height="34" rx="17" fill="#0D1A25" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><text x="45.5" y="23" text-anchor="middle" class="m" font-size="16" fill="#A8C2D2">.NET 9</text></g><g transform="translate(165 304)"><rect width="81" height="34" rx="17" fill="#0D1A25" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><text x="40.5" y="23" text-anchor="middle" class="m" font-size="16" fill="#A8C2D2">stdio</text></g><g transform="translate(256 304)"><rect width="71" height="34" rx="17" fill="#0D1A25" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><text x="35.5" y="23" text-anchor="middle" class="m" font-size="16" fill="#A8C2D2">HTTP</text></g><g transform="translate(337 304)"><rect width="91" height="34" rx="17" fill="#0D1A25" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><text x="45.5" y="23" text-anchor="middle" class="m" font-size="16" fill="#A8C2D2">Docker</text></g><path id="w1" d="M884 190 L912 190" fill="none" stroke="#FF5A73" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#FF5A73"><animateMotion dur="1.6s" begin="-0.0s" repeatCount="indefinite"><mpath href="#w1"/></animateMotion></circle><path id="w2" d="M1008 190 L1072 110" fill="none" stroke="#6FA8D0" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#6FA8D0"><animateMotion dur="2.2s" begin="-0.0s" repeatCount="indefinite"><mpath href="#w2"/></animateMotion></circle><path id="w3" d="M1008 190 L1072 190" fill="none" stroke="#6FA8D0" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#6FA8D0"><animateMotion dur="2.2s" begin="-0.6s" repeatCount="indefinite"><mpath href="#w3"/></animateMotion></circle><path id="w4" d="M1008 190 L1072 270" fill="none" stroke="#6FA8D0" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#6FA8D0"><animateMotion dur="2.2s" begin="-1.2s" repeatCount="indefinite"><mpath href="#w4"/></animateMotion></circle><circle class="spin" cx="960" cy="190" r="46.800000000000004" fill="none" stroke="#FF5A73" stroke-opacity=".35" stroke-dasharray="2 10"/><circle class="spin r" cx="960" cy="190" r="61.2" fill="none" stroke="#6FA8D0" stroke-opacity=".25" stroke-dasharray="36 18"/><g class="pulse"><polygon points="960.0,165.0 982.5,177.5 982.5,202.5 960.0,215.0 937.5,202.5 937.5,177.5" fill="#080F17" stroke="url(#brand)" stroke-width="4.0" stroke-linejoin="round"/><polygon points="960.0,177.5 970.0,190.0 960.0,202.5 950.0,190.0" fill="url(#brand)" opacity=".9"/></g><g transform="translate(770 173)"><rect width="110" height="34" rx="17" fill="#0D1A25" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><text x="55.0" y="23" text-anchor="middle" class="m" font-size="16" fill="#FAFFFD">AI agent</text></g><g transform="translate(1072 93)"><rect width="100" height="34" rx="17" fill="#0D1A25" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><text x="50.0" y="23" text-anchor="middle" class="m" font-size="16" fill="#FAFFFD">Unity</text></g><g transform="translate(1072 173)"><rect width="100" height="34" rx="17" fill="#0D1A25" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><text x="50.0" y="23" text-anchor="middle" class="m" font-size="16" fill="#FAFFFD">Godot</text></g><g transform="translate(1072 253)"><rect width="100" height="34" rx="17" fill="#0D1A25" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><text x="50.0" y="23" text-anchor="middle" class="m" font-size="16" fill="#FAFFFD">Unreal</text></g>
    <rect x="0" y="378" width="1200" height="2" fill="url(#rule)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="379" rx="18" fill="none" stroke="rgba(111,168,208,0.16)"/>
</svg>
