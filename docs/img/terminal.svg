<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-label="A terminal session: gamedev-mcp-server starts on port 8080 with the streamable HTTP transport, then configure writes a pinned Claude Code config for the project">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#162032"/></linearGradient>
    <clipPath id="frame"><rect width="1000" height="410" rx="14"/></clipPath>
  </defs>
  <style>
    .m { font-family: "JetBrains Mono", "Cascadia Code", Consolas, Menlo, monospace; font-size: 14px; white-space: pre; }
    .note { fill: #7c87a6; font-size: 12px; font-style: italic; }
    .l { animation: in .35s ease-out both; }
    @keyframes in { from { opacity: 0; } to { opacity: 1; } }
    .t1 { animation-delay: .3s; } .t2 { animation-delay: 1.2s; } .t3 { animation-delay: 1.6s; } .t4 { animation-delay: 1.9s; }
    .t5 { animation-delay: 3.2s; } .t6 { animation-delay: 4.1s; } .t7 { animation-delay: 4.3s; } .t8 { animation-delay: 4.5s; }
    .t9 { animation-delay: 4.7s; } .t10 { animation-delay: 4.9s; } .t11 { animation-delay: 5.6s; }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1000" height="410" fill="#0b1222"/>
    <rect width="1000" height="44" fill="url(#bar)"/>
    <circle cx="26" cy="22" r="6.5" fill="#f87171"/><circle cx="48" cy="22" r="6.5" fill="#fbbf24"/><circle cx="70" cy="22" r="6.5" fill="#34d399"/>
    <text x="500" y="27" text-anchor="middle" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">~/my-game — gamedev-mcp-server 9.5.2</text>

    <g class="m">
      <text class="l t1" x="30" y="82"><tspan fill="#34d399">❯</tspan><tspan fill="#f8fafc"> gamedev-mcp-server --client-transport streamableHttp --port 8080</tspan></text>
      <text class="l t2" x="30" y="108"><tspan fill="#94a3b8">Parsed arguments: { </tspan><tspan fill="#a5b4fc">"Port"</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#fcd34d">8080</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#a5b4fc">"ClientTransport"</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#fcd34d">"streamableHttp"</tspan><tspan fill="#94a3b8">, … }</tspan></text>
      <text class="l t3" x="30" y="134"><tspan fill="#34d399">info: </tspan><tspan fill="#e2e8f0">Start listening on port: 8080 (bind: loopback)</tspan></text>
      <text class="l t4" x="30" y="160"><tspan fill="#34d399">info: </tspan><tspan fill="#e2e8f0">MCP auth mode: none (transport: streamableHttp, bind: loopback).</tspan></text>
      <text class="l t4 note" x="970" y="186" text-anchor="end">← the engine plugin connects here over SignalR</text>

      <text class="l t5" x="30" y="226"><tspan fill="#34d399">❯</tspan><tspan fill="#f8fafc"> gamedev-mcp-server configure --agent claude-code</tspan></text>
      <text class="l t6" x="30" y="252"><tspan fill="#34d399">Configured Claude Code (claude-code).</tspan></text>
      <text class="l t7" x="30" y="278"><tspan fill="#94a3b8">  transport : </tspan><tspan fill="#e2e8f0">streamableHttp</tspan></text>
      <text class="l t8" x="30" y="304"><tspan fill="#94a3b8">  pin       : </tspan><tspan fill="#fcd34d">728ad6d4</tspan></text>
      <text class="l t8 note" x="970" y="304" text-anchor="end">← derived from the project path</text>
      <text class="l t9" x="30" y="330"><tspan fill="#94a3b8">  port      : </tspan><tspan fill="#fcd34d">29938</tspan></text>
      <text class="l t10" x="30" y="356"><tspan fill="#94a3b8">  config    : </tspan><tspan fill="#67e8f9">~/my-game/.mcp.json</tspan></text>
      <text class="l t10 note" x="970" y="356" text-anchor="end">← URL only, no credentials</text>
      <text class="l t11" x="30" y="388"><tspan fill="#34d399">❯</tspan></text>
    </g>
    <rect class="caret" x="48" y="374" width="9" height="18" fill="#e2e8f0"/>
  </g>
  <rect x=".5" y=".5" width="999" height="409" rx="14" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
</svg>
